<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CataractAI | Login</title>

    <!-- ✅ Inline CSS (same look as Signup pages) -->
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #a7c5eb, #c6e2ff);
        margin: 0;
        padding: 0;
      }

      /* Navbar */
      .navbar {
        background-color: #004aad;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 30px;
      }

      .navbar .logo img {
        width: 55px;
        height: 55px;
        border-radius: 50%;
      }

      .navbar ul {
        list-style: none;
        display: flex;
        margin: 0;
        padding: 0;
      }

      .navbar ul li {
        margin-left: 20px;
      }

      .navbar ul li a {
        text-decoration: none;
        color: white;
        font-weight: bold;
        transition: 0.3s ease;
      }

      .navbar ul li a:hover {
        color: #ffe600;
      }

      /* Login Container */
      .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
      }

      .login-box {
        background-color: #ffffff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0, 123, 255, 0.15);
        width: 320px;
        text-align: center;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .login-box:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 30px rgba(0, 123, 255, 0.2);
      }

      .login-box h2 {
        color: #004aad;
        margin-bottom: 25px;
      }

      .input-group {
        text-align: left;
        margin-bottom: 18px;
      }

      .input-group label {
        display: block;
        margin-bottom: 5px;
        color: #333;
        font-weight: bold;
      }

      .input-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
      }

      .login-button {
        background-color: #004aad;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 12px 18px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s ease;
        width: 100%;
      }

      .login-button:hover {
        background-color: #002f6c;
      }

      /* Footer */
      .footer {
        text-align: center;
        padding: 15px;
        background-color: #004aad;
        color: white;
      }

      .footer a {
        color: #ffe600;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <!-- ✅ Navigation Bar -->
    <nav class="navbar">
      <div class="logo">
        <a href="/">
          <img
            src="{{ url_for('static', filename='eye.png') }}"
            alt="CataractAI Logo"
          />
        </a>
      </div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="login">Login</a></li>
        <li><a href="signup_staff">Signup Staff</a></li>
        <li><a href="signup_patient">Patient Register</a></li>
      </ul>
    </nav>

    <!-- ✅ Login Box -->
    <div class="login-container">
      <div class="login-box">
        <h2>Login</h2>
        <form id="loginForm" action="{{ url_for('login') }}" method="post">
          <div class="input-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              required
            />
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Password"
              required
            />
          </div>

          <button type="submit" class="login-button">Log In</button>
        </form>

        <br>
      </div>
    </div>

    <!-- ✅ Footer -->
    <footer class="footer">
      <p>
        Copyright &copy; 2024 |
        <a href="#">CataractAI</a>
      </p>
    </footer>

    <!-- ✅ JavaScript for Login Popup -->
    <script>
      document.getElementById("loginForm").addEventListener("submit", function (e) {
        let email = document.getElementById("email").value.trim();
        if (email === "") {
          alert("Please enter your email before logging in.");
          e.preventDefault();
          return;
        }
        alert("Login successful for " + email + "!");
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CataractAI | Patient Register</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <style>
      /* --- Core Styles (From Staff Signup) --- */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: linear-gradient(
            rgba(0, 123, 255, 0.1),
            rgba(255, 255, 255, 0.9)
          ),
          url("{{ url_for('static', filename='ai_eye_bg.png') }}") no-repeat
            center center/cover;
        min-height: 100vh;
        color: #222;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #007bff;
        padding: 12px 40px;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }

      .navbar .logo img {
        height: 45px;
        width: 45px;
      }

      .nav-links {
        list-style: none;
        display: flex;
        gap: 25px;
      }

      .nav-links li a {
        text-decoration: none;
        color: white;
        font-weight: 500;
        transition: 0.3s;
      }

      .nav-links li a:hover {
        color: #ffde59;
      }

      .signup-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 120px;
      }

      .signup-box {
        background: white;
        padding: 40px 30px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 123, 255, 0.1);
        width: 350px;
        text-align: center;
        animation: fadeIn 1s ease-in-out;
      }

      .signup-box h2 {
        color: #007bff;
        margin-bottom: 20px;
      }

      .input-group {
        margin-bottom: 15px;
        text-align: left;
      }

      .input-group label {
        display: block;
        font-weight: 500;
        margin-bottom: 5px;
      }

      .input-group input,
      .input-group select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        transition: 0.3s;
      }

      .input-group input:focus,
      .input-group select:focus {
        border-color: #007bff;
        outline: none;
      }

      .login-button {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        font-size: 1rem;
        transition: 0.3s;
      }

      .login-button:hover {
        background: #005ec4;
      }

      .patient-list {
        margin-top: 40px;
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 123, 255, 0.1);
        width: 80%;
        max-width: 700px;
        animation: fadeIn 1.2s ease-in-out;
      }

      .patient-list h3 {
        color: #007bff;
        margin-bottom: 15px;
        text-align: center;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      table th,
      table td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: center;
      }

      table th {
        background-color: #007bff;
        color: white;
      }

      table td button {
        border: none;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        color: white;
        font-size: 0.9rem;
      }

      .edit-btn {
        background: #28a745;
      }

      .delete-btn {
        background: #dc3545;
      }

      .edit-btn:hover {
        background: #218838;
      }

      .delete-btn:hover {
        background: #c82333;
      }

      .footer {
        text-align: center;
        background: #007bff;
        color: white;
        padding: 15px 0;
        font-size: 0.9rem;
        margin-top: 50px;
      }

      /* Popup Modal */
      .modal {
        display: none;
        position: fixed;
        z-index: 2000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        background: white;
        padding: 25px 40px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        animation: fadeIn 0.5s ease-in-out;
      }

      .modal-content h3 {
        color: #007bff;
      }

      .modal-content button {
        background: #007bff;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        margin-top: 15px;
        cursor: pointer;
      }

      .modal-content button:hover {
        background: #005ec4;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="logo">
        <a href="/">
          <img
            src="{{ url_for('static', filename='eye.png') }}"
            alt="CataractAI Logo"
          />
        </a>
      </div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="login">Login</a></li>
        <li><a href="signup_staff">Signup Staff</a></li>
        <li><a href="signup_patient">Patient Register</a></li>
      </ul>
    </nav>

    <!-- Registration Form -->
    <div class="signup-container">
      <div class="signup-box">
        <h2>Patient Register</h2>
        <form id="patientForm">
          <div class="input-group">
            <label for="name">Name</label>
            <input type="text" id="name" required />
          </div>

          <div class="input-group">
            <label for="age">Age</label>
            <input type="number" id="age" required />
          </div>

          <div class="input-group">
            <label for="gender">Gender</label>
            <select id="gender" required>
              <option value="" disabled selected>Select</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" required />
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" required />
          </div>

          <button type="submit" class="login-button">Register</button>
        </form>
      </div>

      <!-- Patient List -->
      <div class="patient-list" id="patientListSection" style="display: none;">
        <h3>Registered Patients</h3>
        <table id="patientTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Age</th>
              <th>Gender</th>
              <th>Email</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Success Popup -->
    <div id="successModal" class="modal">
      <div class="modal-content">
        <h3 id="modalText"></h3>
        <button onclick="closeModal()">OK</button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; 2024 | CataractAI | All Rights Reserved</p>
    </footer>

    <script>
      const form = document.getElementById("patientForm");
      const tableBody = document.querySelector("#patientTable tbody");
      const modal = document.getElementById("successModal");
      const modalText = document.getElementById("modalText");
      const patientListSection = document.getElementById("patientListSection");

      let patients = [];

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const age = document.getElementById("age").value;
        const gender = document.getElementById("gender").value;
        const email = document.getElementById("email").value.trim();

        if (!name || !age || !gender || !email) return;

        const patient = { name, age, gender, email };
        patients.push(patient);

        showModal(`Patient Registered Successfully: ${name}`);
        form.reset();
        renderPatients();
      });

      function renderPatients() {
        tableBody.innerHTML = "";
        patients.forEach((p, index) => {
          const row = `
            <tr>
              <td>${p.name}</td>
              <td>${p.age}</td>
              <td>${p.gender}</td>
              <td>${p.email}</td>
              <td>
                <button class="edit-btn" onclick="editPatient(${index})">Edit</button>
                <button class="delete-btn" onclick="deletePatient(${index})">Delete</button>
              </td>
            </tr>`;
          tableBody.insertAdjacentHTML("beforeend", row);
        });
        patientListSection.style.display = patients.length ? "block" : "none";
      }

      function editPatient(index) {
        const p = patients[index];
        document.getElementById("name").value = p.name;
        document.getElementById("age").value = p.age;
        document.getElementById("gender").value = p.gender;
        document.getElementById("email").value = p.email;
        patients.splice(index, 1);
        renderPatients();
      }

      function deletePatient(index) {
        patients.splice(index, 1);
        renderPatients();
      }

      function showModal(message) {
        modalText.textContent = message;
        modal.style.display = "flex";
      }

      function closeModal() {
        modal.style.display = "none";
      }
    </script>
  </body>
</html>
